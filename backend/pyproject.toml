[project]
name = "ttb-label-review"
version = "0.1.0"
description = "TTB alcohol label pre-screener — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pypdf[crypto]>=5.1.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pillow>=11.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI's Depends()/File()/Form() in argument defaults is the required pattern, not a bug
]
